    <script>
      // Set the theme before the first paint, so a saved Dark doesn't flash light.
      // src/theme.ts keeps it up to date afterwards.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("orukan.playground.theme"); } catch (e) {}
        var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
